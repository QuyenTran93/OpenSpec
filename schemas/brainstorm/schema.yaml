name: brainstorm
version: 1
description: Brainstorm-first workflow — brainstorm.md → tasks.md → plan.md → apply
artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: Agreed problem framing and design direction
    template: brainstorm.md
    requires: []
    instruction: |
      Write a substantive brainstorm.md using the resolved output path returned
      by this command. Inspect the relevant codepaths, entrypoints, configs,
      tests, and runtime boundaries before comparing approaches. Record the
      exact files, commands, invariants, runtime signals, and unknowns that materially
      shaped the design so implementation
      starts from evidence instead of guesswork. Cover success criteria, current
      context, viable approaches, architecture, component responsibilities,
      interfaces and data flow, errors and edge cases, compatibility and
      migration, testing, risks, and questions.
      Review it for placeholders, contradictions, scope, ambiguity, requirements coverage,
      and alignment between behavior and architecture; fix findings
      inline. The workflow prompt supplies the shared choice, review, prose, and
      follow-up policies; apply those policies while creating this artifact.

  - id: tasks
    generates: tasks.md
    description: Stable, trackable implementation checklist
    template: tasks.md
    requires: [brainstorm]
    instruction: |
      Read brainstorm.md from this resolved change directory. Create or reconcile
      outcome-oriented tasks in dependency order. Use stable numeric task IDs and
      preserve - [x] state when a task's meaning is unchanged. Never silently
      delete a completed task that conflicts with revised scope; annotate it for
      explicit user resolution.

  - id: plan
    generates: plan.md
    description: Concrete implementation plan with verification
    template: plan.md
    requires: [brainstorm, tasks]
    instruction: |
      Read brainstorm.md and tasks.md from this resolved change directory. Map
      files to responsibilities and decompose the work into independently
      testable deliverables. Resolve the exact setup prerequisites, existing
      verification commands, entrypoints, runtime dependencies, fixtures, and
      affected boundaries before locking the task breakdown. Include architecture,
      tech stack, global constraints, preconditions and recon, file
      responsibilities, source task IDs, exact paths, interfaces, bite-sized
      checkbox steps, failing tests, RED commands and expected failures, minimal
      implementation guidance, GREEN commands and expected passes, refactoring,
      review and commit checkpoints, and final verification. Include a pre-edit
      baseline or reproduction command when behavior is changing or a bug is
      being fixed, plus the project-level regression commands needed before
      completion. Ban placeholders and undefined interfaces. Check requirements
      coverage, dependency order, task sizing, executable commands, and
      identifier/type consistency.
      Before choosing Test paths, inspect the relevant repository,
      package, or module. The existing local test convention is authoritative:
      reuse `tests/`, `test/`, or `__tests__/`, or preserve a deliberate colocated-test convention.
      If none exists, use `tests/` at the nearest package or module scope.
      Do not introduce a second test-root convention within the same scope.
      Do not migrate existing tests. Do not create an empty test directory for
      documentation-only or configuration-only work. Replace every semantic template placeholder
      with the exact project-specific path, code-fence language, command, and expected result.
      Raw semantic placeholders must not remain in plan.md. When available,
      use a review-only subagent for independent review; otherwise perform expanded
      inline self-review. Obtain user approval before apply. Do not require an
      external plugin. A documentation-only or configuration-only task may omit
      RED/GREEN steps only when it states why no behavior changes and supplies a
      concrete validation command with its expected result. Follow-up is accepted
      product or engineering scope deliberately deferred beyond this change. Work
      required to complete the current change or meet its requirements and success
      criteria must remain in tasks.md and plan.md. Record eligible work in
      <planningHome.root>/TODO.md using the CLI-returned planning root. Preserve
      existing content, reconcile semantically equivalent entries, and state the
      deferred outcome, why it was deferred, the originating change, and resumable
      context or acceptance criteria. Do not create or modify TODO.md when no
      eligible follow-up exists. Excluded routine workflow-completion steps include
      manual testing, verification, archiving, automated checks, review, required
      documentation, correctness cleanup, VCS decisions, and handoff.

apply:
  requires: [plan]
  tracks: tasks.md
  instruction: |
    Implement the agreed plan using test-first development for behavior changes:
    RED → GREEN → REFACTOR. When behavior is unexpected, reproduce it, gather
    evidence, trace the failing path, test one hypothesis at a time, fix the root
    cause, and add a regression test. Review requirements compliance before code
    quality. Verify review feedback against the code and requirements. Never
    claim completion without fresh verification evidence. Implementation runs
    inline in the primary session. Subagents may be used only for independent
    review or read-only research; they must not edit files, implement tasks, or
    orchestrate the apply loop. Establish or verify an isolated worktree when safe,
    preserve dirty overlapping work, and execute tasks in dependency order. Verify
    review feedback against the code and requirements. If unavailable, use expanded
    inline self-review. Leave commit, push, merge, and branch integration decisions
    to the user or controlling repository policy. Follow-up is accepted product or
    engineering scope deliberately deferred beyond this change. Work required to
    complete the current change or meet its requirements and success criteria must
    remain in tasks.md and plan.md. Record eligible work in
    <planningHome.root>/TODO.md using the CLI-returned planning root. Preserve
    existing content, reconcile semantically equivalent entries, and state the
    deferred outcome, why it was deferred, the originating change, and resumable
    context or acceptance criteria. Do not create or modify TODO.md when no eligible
    follow-up exists. Excluded routine workflow-completion steps include
    manual testing, verification, archiving, automated checks, review, required
    documentation, correctness cleanup, VCS decisions, and handoff.
    Before the first edit, confirm the execution surface: exact package or
    module, focused test command, project-level verification command, and any
    required services, fixtures, or environment flags. For bug fixes or behavior
    changes, reproduce the current behavior or intended RED state before editing.
    If tooling, dependencies, or environment are missing, surface the blocker immediately instead of guessing or claiming progress.
    A task is complete only after its acceptance criteria and focused verification pass.
    Immediately persist its - [ ] → - [x] transition in tasks.md before starting the next task.
    Never batch-fill checkboxes at the end of a session. Never mark failed, partial, or blocked work complete.
    If updating tasks.md fails, stop before the next task and report the error.
    On resume, reread tasks.md and continue from the first incomplete task in dependency order.
